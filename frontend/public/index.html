        <meta name="description" content="Inmobiliaria Varela en Costa del Este y Mar del Tuyú. 20 años en la zona. Casas, lotes, PH y departamentos en venta y alquiler. Tasación online gratuita y Portal del Propietario." />

        <!-- CSS crítico del header + hero del sitio público (inline, cero bytes de red):
             así el navegador puede pintar correctamente la zona visible ANTES de que
             termine de bajar main.css (reportado por Lighthouse como ~830ms de bloqueo).
             Son las mismas reglas que ya existen en index.css — duplicadas a propósito,
             nada se pierde cuando main.css termina de cargar. Solo aplica en el sitio
             público (todo bajo .vh-root); /veraos y /alquileres no usan estas clases. -->
        <style>
          body{margin:0;background:#0A0A0B;color:#fff;-webkit-font-smoothing:antialiased}
          .vh-root{--vh-bg:#0A0A0B;--vh-surface:#121214;--vh-border:rgba(255,255,255,.08);--vh-brand:#F6E63A;--vh-brand-hover:#E5D52A;--vh-text:#FFF;--vh-muted:#A1A1AA;background:var(--vh-bg);color:var(--vh-text);font-family:'Manrope',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
          .vh-root *,.vh-root *::before,.vh-root *::after{box-sizing:border-box}
          .vh-root em{font-style:normal;color:var(--vh-brand)}
          .vh-h1{font-family:'Clash Display','Manrope',sans-serif;font-weight:700;margin:0;font-size:clamp(2.6rem,6vw,5rem);line-height:1.05;letter-spacing:-.02em}
          .vh-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;text-transform:uppercase;letter-spacing:.22em;font-weight:700;color:var(--vh-brand)}
          .vh-btn{display:inline-flex;align-items:center;gap:9px;justify-content:center;border-radius:999px;padding:13px 24px;font-size:.95rem;font-weight:700;cursor:pointer;border:1px solid transparent;text-decoration:none;white-space:nowrap}
          .vh-btn--brand{background:var(--vh-brand);color:#0A0A0B}
          .vh-btn--ghost{background:rgba(255,255,255,.05);color:#fff;border-color:var(--vh-border);backdrop-filter:blur(8px)}
          .vh-nav{position:sticky;top:0;z-index:50;background:rgba(10,10,11,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--vh-border)}
          .vh-nav__inner{max-width:1220px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
          .vh-nav__brand img{height:34px;width:auto;display:block}
          .vh-nav__links{display:flex;align-items:center;gap:26px}
          .vh-nav__cta{padding:10px 18px;font-size:.9rem}
          .vh-nav__burger{display:none;background:none;border:none;color:#fff;cursor:pointer}
          .vh-hero{position:relative;min-height:92vh;display:flex;align-items:center;overflow:hidden}
          .vh-hero__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background-color:#0a0a0b;transform:scale(1.05)}
          .vh-hero__scrim{position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,10,11,.97) 0%,rgba(10,10,11,.82) 42%,rgba(10,10,11,.35) 100%)}
          .vh-hero__inner{position:relative;max-width:1220px;margin:0 auto;padding:0 24px;width:100%}
          .vh-hero__inner>*{animation:vhUp .7s cubic-bezier(.22,1,.36,1) both}
          .vh-hero .vh-eyebrow{animation-delay:.05s}
          .vh-hero .vh-h1{margin:18px 0 0;max-width:16ch}
          .vh-hero__sub{color:#d4d4d8;font-size:clamp(.95rem,1.5vw,1.15rem);margin:20px 0 0;animation-delay:.15s}
          .vh-hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;animation-delay:.25s}
          .vh-hero__kicker{display:block;color:var(--vh-muted);font-family:'Manrope',sans-serif;font-size:.82rem;font-weight:600;letter-spacing:.01em;margin-bottom:6px}
          @keyframes vhUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
          @media (max-width:860px){.vh-nav__links{position:fixed;inset:62px 0 auto 0;flex-direction:column;align-items:stretch;gap:0;background:rgba(10,10,11,.98);backdrop-filter:blur(18px);border-bottom:1px solid var(--vh-border);padding:12px 24px 22px;transform:translateY(-120%);opacity:0;pointer-events:none}.vh-nav__links.is-open{transform:none;opacity:1;pointer-events:auto}.vh-nav__cta{margin-top:14px}.vh-nav__burger{display:inline-flex}}
          @media (max-width:768px){.vh-hero__inner>*{animation:vhUpMobile .35s ease-out both}@keyframes vhUpMobile{from{opacity:1;transform:translateY(8px)}to{opacity:1;transform:none}}}
        </style>
