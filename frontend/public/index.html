        <!-- Precarga del hero (elemento LCP) de la home: el navegador lo descubre apenas
             parsea el HTML, antes de que baje ningún bundle de JS. Solo en home (no suma
             peso en el resto del sitio, que comparte este mismo index.html). -->
        <script>
          (function () {
            if (location.pathname !== "/" && location.pathname !== "/inicio") return;
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "image";
            // Mismos candidatos/criterio que el <img srcset> real del hero, para que el
            // navegador precargue EXACTAMENTE el archivo que después va a pedir (si no
            // coinciden, en pantallas de alta densidad el hero se termina bajando 2 veces).
            link.imageSrcset = "/hero/hero-mobile.webp 640w, /hero/hero-desktop.webp 1264w";
            link.imageSizes = "100vw";
            link.fetchPriority = "high";
            document.head.appendChild(link);
          })();
        </script>
